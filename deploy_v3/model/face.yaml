# 96x96 grayscale meeting-room face detector, width 0.75 variant with SPPF.
# v3: wider MobileNetV2-style backbone than v2, keeps SPPF before both Detect
# head inputs, and uses a wider lite head (mid=32) for higher accuracy.
nc: 1
reg_max: 1
depth_multiple: 1.0
width_multiple: 0.75

backbone:
  # Stem: standard 3x3 conv, 96 -> 48
  - [-1, 1, Conv, [32, 3, 2]]
  # Stage 1: 48x48 -> 24x24
  - [-1, 1, Conv, [64, 1, 1]]
  - [-1, 1, DWConv, [64, 3, 1]]
  - [-1, 1, Conv, [32, 1, 1]]
  - [-1, 1, Conv, [64, 1, 1]]
  - [-1, 1, DWConv, [64, 3, 2]]
  - [-1, 1, Conv, [48, 1, 1]]
  # Stage 2: 24x24 -> 12x12
  - [-1, 1, Conv, [96, 1, 1]]
  - [-1, 1, DWConv, [96, 3, 1]]
  - [-1, 1, Conv, [48, 1, 1]]
  - [-1, 1, Conv, [96, 1, 1]]
  - [-1, 1, DWConv, [96, 3, 2]]
  - [-1, 1, Conv, [64, 1, 1]]
  # Stage 3: 12x12 -> 6x6
  - [-1, 1, Conv, [128, 1, 1]]
  - [-1, 1, DWConv, [128, 3, 1]]
  - [-1, 1, Conv, [64, 1, 1]]
  - [-1, 1, SPPF, [64, 5]]
  - [-1, 1, Conv, [128, 1, 1]]
  - [-1, 1, DWConv, [128, 3, 2]]
  - [-1, 1, Conv, [96, 1, 1]]
  - [-1, 1, Conv, [192, 1, 1]]
  - [-1, 1, DWConv, [192, 3, 1]]
  - [-1, 1, Conv, [96, 1, 1]]
  - [-1, 1, SPPF, [96, 5]]

head:
  - [[16, 23], 1, Detect, [nc]]
